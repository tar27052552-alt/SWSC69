    <title>Admin | SWSC69</title>
    <script>
      // Auto-redirect to admin page when accessing via /admin/ subdirectory
      (function() {
        var hash = window.location.hash;
        // If no hash, or hash is just #/ or #/dashboard, redirect to #/admin
        if (!hash || hash === '#/' || hash === '#/dashboard' || hash === '') {
          window.location.replace(window.location.pathname + '#/admin');
        }
      })();
    </script>
